# Training environment for M4: the only one with Lux, Optimisers and Zygote, which together
# trigger `RikFlowLuxExt`. The deployed closure needs none of them.
#
# 🔴 **`[sources]` is what makes this work on a fresh checkout, and its absence was a real
# failure on Snellius (2026-09-18):** `RikFlow` is a local package, and the path to it lived
# ONLY in `training/Manifest.toml`, which is NOT tracked by git. With no manifest present
# `Pkg.instantiate()` has nowhere to look and fails with
#
#     ERROR: expected package `RikFlow [07f19e49]` to be registered
#
# naming a registry the package will never be in. Declaring the path here puts it in the
# TRACKED file, so any checkout resolves it. (`lib/RikFlow/test` does not need this: it
# deliberately does not depend on RikFlow at all and `include`s the stdlib-only `ts_*` files.)
# ⚠️ `[sources]` needs Julia >= 1.11; Snellius' juliaup default is 1.13 and this repo's
# floor moved to 1.12 with the 2026-09-10 package update, so that is not a constraint.

[deps]
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
JLArrays = "27aeb0d3-9eb9-45fb-866b-73c2ecf80fcb"
JLD2 = "033835bb-8acc-5ee8-8aae-3f567f8a3819"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Lux = "b2108857-7c20-44ae-9111-449ecde12c47"
MLUtils = "f1d291b0-491e-4a28-83b9-f70985020b54"
Optimisers = "3bd65402-5787-11e9-1adc-39752487f4e2"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
RikFlow = "07f19e49-00df-4880-aa48-bf317467130b"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Zygote = "e88e6eb3-aa80-5325-afca-941959d7151f"

[sources]
RikFlow = {path = ".."}
